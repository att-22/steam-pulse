# Collects snapshots of Steam and commits them to the `data` branch.
#
# Scheduled workflows only run from the default branch, and `main` only changes through
# pull requests, so the code is read from `main` and the data is written to a separate
# branch that holds nothing but data.
name: Collect

on:
  schedule:
    # Twice an hour, away from minute 0: GitHub delays scheduled runs when many start at
    # once, which is mostly at the top of the hour, and under load it may drop them
    # altogether. The second run is a spare: one snapshot per hour is enough, and
    # collecting a snapshot that is already stored changes nothing.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write           # to push the snapshot to the data branch

# Two runs at once would push to the same branch: the second waits for the first.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collect snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Check out the data branch
        uses: actions/checkout@v5
        with:
          ref: data
          path: data

      # No dependencies to install: the collector uses the standard library only.
      - name: Collect
        run: python3 -m steam_pulse.collect --output data
        env:
          PYTHONPATH: src

      # The details of the games that have none yet: all of them the first time, then
      # only the ones that enter the ranking. Names can wait and snapshots cannot, so a
      # failure here is shown on the step but does not fail the run.
      - name: Collect game details
        continue-on-error: true
        run: python3 -m steam_pulse.details --output data
        env:
          PYTHONPATH: src

      # Runs even if the collection failed: a rejected response is worth keeping too.
      - name: Commit the snapshot
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit --quiet --message "data: snapshot $(date --utc +%Y-%m-%dT%H:%MZ)"
          git push
