name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  # Loads a few real snapshots kept in the repository and builds every model on them,
  # with all their tests. No warehouse to connect to: it is a DuckDB file on the runner.
  models:
    name: Models (dbt)
    runs-on: ubuntu-latest
    env:
      STEAM_PULSE_DATABASE: ${{ github.workspace }}/ci.duckdb
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run load --input tests/sample --database ci.duckdb
      - run: uv run dbt build
        working-directory: transform

  # The hourly job runs with the runner's own Python and no installation step.
  # So does the freshness check. This checks that all three still work that way,
  # without calling Steam.
  collector:
    name: Collector runs without installing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m steam_pulse.collect --help
        env:
          PYTHONPATH: src
      - run: python3 -m steam_pulse.details --help
        env:
          PYTHONPATH: src
      - run: python3 -m steam_pulse.freshness --help
        env:
          PYTHONPATH: src
