name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      # The hosted dashboard installs from dashboard/requirements.txt, exported from the
      # lock file. Exporting again must change nothing, or the two have drifted apart.
      - run: >-
          uv export --no-default-groups --group dashboard --group warehouse
          --no-emit-project --no-hashes --format requirements-txt
          -o dashboard/requirements.txt --quiet
      - run: git diff --exit-code dashboard/requirements.txt

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  # Loads a few real snapshots kept in the repository, builds every model on them with
  # all their tests, and renders the dashboard on the result. No warehouse to connect to: it is a DuckDB file on the runner.
  models:
    name: Models (dbt)
    runs-on: ubuntu-latest
    env:
      STEAM_PULSE_DATABASE: ${{ github.workspace }}/ci.duckdb
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run load --input tests/sample --database ci.duckdb
      - run: uv run dbt build
        working-directory: transform
      # The dashboard, run headless on the tables just built: every section renders.
      - run: uv run pytest tests/test_dashboard_page.py
      # Again, with only what the hosted copy installs (dashboard/requirements.txt), so a
      # dependency that only arrives here through another group cannot hide.
      - name: Dashboard with the hosted dependencies only
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/hosted"
          uv pip install --python "$RUNNER_TEMP/hosted" -r dashboard/requirements.txt pytest
          PYTHONPATH=src "$RUNNER_TEMP/hosted/bin/python" -m pytest tests/test_dashboard_page.py

  # The hourly job runs with the runner's own Python and no installation step.
  # So does the freshness check. This checks that all three still work that way,
  # without calling Steam.
  collector:
    name: Collector runs without installing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m steam_pulse.collect --help
        env:
          PYTHONPATH: src
      - run: python3 -m steam_pulse.details --help
        env:
          PYTHONPATH: src
      - run: python3 -m steam_pulse.freshness --help
        env:
          PYTHONPATH: src
