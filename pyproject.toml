[project]
name = "steam-pulse"
version = "0.1.0"
description = "What is being played on Steam, hour by hour: collection, modelling and dashboard"
readme = "README.md"
authors = [{ name = "Adrià Tadeo Tormos" }]
requires-python = ">=3.12"
# The collector runs every hour on a bare runner, so it uses the standard library only:
# nothing to install means nothing that can fail to install.
dependencies = []

[project.scripts]
collect = "steam_pulse.collect:main"
details = "steam_pulse.details:main"
freshness = "steam_pulse.freshness:main"
load = "steam_pulse.load:main"
publish = "steam_pulse.publish:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_pulse"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
# The dbt models that turn the raw snapshots into tables.
transform = [
    "dbt-duckdb>=1.11.0",
]
# Only the load into the warehouse needs these; the collector never imports them.
warehouse = [
    "duckdb>=1.5.6",
]
# The dashboard that reads the tables built by the models. DuckDB needs pytz to hand
# timestamps with a time zone to Python; elsewhere it arrives with dbt, here it does not.
dashboard = [
    "pytz>=2026.5",
    "streamlit>=1.66.0",
]

[tool.uv]
default-groups = ["dev", "warehouse", "transform", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
