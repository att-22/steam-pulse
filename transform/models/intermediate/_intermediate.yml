version: 2

models:
  - name: int_hourly_snapshots
    description: >
      One row per hour that has data, with the ranking snapshot that stands for it: the
      last one Steam computed within that hour. Hours that were not collected have no row.
    columns:
      - name: hour_at
        description: The start of the hour, in UTC.
        data_tests: [unique, not_null]
      - name: snapshot_id
        description: The snapshot chosen for the hour.
        data_tests: [unique, not_null]
      - name: snapshot_at
        description: When Steam computed that snapshot.
        data_tests: [not_null]
      - name: collected_at
        description: When the collector asked for it.
        data_tests: [not_null]

unit_tests:
  - name: the_last_snapshot_of_each_hour_stands_for_it
    model: int_hourly_snapshots
    given:
      - input: ref('stg_concurrent_players')
        rows:
          # Two games of the same snapshot must not turn into two rows
          - {snapshot_id: A, appid: 730, snapshot_at: "2026-10-12 14:05:00+00", collected_at: "2026-10-12 14:06:00+00"}
          - {snapshot_id: A, appid: 570, snapshot_at: "2026-10-12 14:05:00+00", collected_at: "2026-10-12 14:06:00+00"}
          - {snapshot_id: B, appid: 730, snapshot_at: "2026-10-12 14:55:00+00", collected_at: "2026-10-12 14:58:00+00"}
          - {snapshot_id: C, appid: 730, snapshot_at: "2026-10-12 14:30:00+00", collected_at: "2026-10-12 14:31:00+00"}
          # Computed at 15:59:59, collected after 16:00: it belongs to the hour of the data
          - {snapshot_id: D, appid: 730, snapshot_at: "2026-10-12 15:59:59+00", collected_at: "2026-10-12 16:02:00+00"}
          - {snapshot_id: E, appid: 730, snapshot_at: "2026-10-12 17:00:00+00", collected_at: "2026-10-12 17:01:00+00"}
    expect:
      rows:
        - {hour_at: "2026-10-12 14:00:00+00", snapshot_id: B, snapshot_at: "2026-10-12 14:55:00+00", collected_at: "2026-10-12 14:58:00+00"}
        - {hour_at: "2026-10-12 15:00:00+00", snapshot_id: D, snapshot_at: "2026-10-12 15:59:59+00", collected_at: "2026-10-12 16:02:00+00"}
        - {hour_at: "2026-10-12 17:00:00+00", snapshot_id: E, snapshot_at: "2026-10-12 17:00:00+00", collected_at: "2026-10-12 17:01:00+00"}
